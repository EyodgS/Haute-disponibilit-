#!/usr/sbin/nft -f
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        iif "lo" accept
        ct state established,related accept

        ip protocol vrrp accept
        tcp dport {22,80,443} accept

        counter reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        ct state established,related accept
        ip saddr 192.168.10.0/24 ip daddr 192.168.20.0/24 tcp dport 80 accept
        ip saddr 192.168.20.0/24 ip daddr 192.168.10.0/24 ct state established,related accept

        counter reject with icmpx type admin-prohibited
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
