global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_http
    bind 192.168.10.100:80
    default_backend be_web

backend be_web
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 192.168.20.21:80 check inter 2s fall 3 rise 2
    server web2 192.168.20.22:80 check inter 2s fall 3 rise 2
