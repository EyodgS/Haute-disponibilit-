server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    location /health {
        add_header Content-Type text/plain;
        return 200 'OK WEB2\n';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass 127.0.0.1:9000;
    }
}
