#!/usr/sbin/nft -f
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        iif "lo" accept
        ct state established,related accept

        ip saddr {192.168.20.11,192.168.20.12,192.168.20.100} tcp dport 80 accept
        tcp dport 22 accept

        counter reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
