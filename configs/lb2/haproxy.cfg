global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Frontend : écoute sur l'IP réelle de LB1 (pas encore la VIP)
frontend fe_web
    bind 192.168.10.100:80
    default_backend be_web

# Backend : WEB1 et WEB2 en roundrobin
backend be_web
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 192.168.20.21:80 check inter 2s fall 3 rise 2
    server web2 192.168.20.22:80 check inter 2s fall 3 rise 2

# Page de stats, accessible uniquement depuis HA-SYNC
listen stats
    bind 10.99.99.12:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:__MOT_DE_PASSE_DANS_GESTIONNAIRE__
