services:
  nginx:
    image: nginx:1.27-alpine
    container_name: novsante_nginx
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  app1:
    build:
      context: ./app
    container_name: novsante_app1
    environment:
      - APP_INSTANCE=app1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=novasante
      - DB_USER=novasante
      - DB_PASSWORD=novasante
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  app2:
    build:
      context: ./app
    container_name: novsante_app2
    environment:
      - APP_INSTANCE=app2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=novasante
      - DB_USER=novasante
      - DB_PASSWORD=novasante
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: novsante_db
    environment:
      - POSTGRES_DB=novasante
      - POSTGRES_USER=novasante
      - POSTGRES_PASSWORD=novasante
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novasante -d novasante"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novsante_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
